name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build WebWheelV.csproj -c Release
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp bin/Release/net48/WebWheelV.dll out/
      - uses: actions/upload-artifact@v4
        with:
          name: WebWheelV
          path: out
